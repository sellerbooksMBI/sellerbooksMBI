name: Structure audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  structure-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build dependencies
        run: npm install --no-package-lock
      - name: Verify Vite build
        run: npm run build
      - name: Check active JavaScript syntax
        run: |
          node --check js/main.js
          find js/modules js/services -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Audit local asset paths and rollback copies
        run: node scripts/audit-structure.mjs

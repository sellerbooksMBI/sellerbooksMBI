name: SellerBooks build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/modularization-phase-1]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build with Vite
        run: npm run build
